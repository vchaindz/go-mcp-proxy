name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags="-s -w" -o go-mcp-proxy-linux-amd64 ./cmd/go-mcp-proxy

      - name: Build macOS amd64
        env:
          GOOS: darwin
          GOARCH: amd64
        run: go build -ldflags="-s -w" -o go-mcp-proxy-darwin-amd64 ./cmd/go-mcp-proxy

      - name: Build macOS arm64
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go build -ldflags="-s -w" -o go-mcp-proxy-darwin-arm64 ./cmd/go-mcp-proxy

      - name: Build Windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags="-s -w" -o go-mcp-proxy-windows-amd64.exe ./cmd/go-mcp-proxy

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            go-mcp-proxy-linux-amd64
            go-mcp-proxy-darwin-amd64
            go-mcp-proxy-darwin-arm64
            go-mcp-proxy-windows-amd64.exe
